<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title">
  <title id="title">Research lab cloud — conceptual architecture</title>
  <rect width="800" height="520" rx="12" fill="#fafbfc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="95" width="720" height="360" rx="12" fill="#f1f5fb" stroke="#cbd5e1"/>
    <text x="400" y="125" font-size="18" fill="#334155">Kubernetes cluster · shared compute pool</text>
    <g fill="#fff" stroke="#cbd5e1">
      <rect x="225" y="20" width="350" height="50" rx="8"/>
      <rect x="80" y="160" width="280" height="65" rx="8"/>
      <rect x="440" y="160" width="280" height="65" rx="8"/>
      <rect x="80" y="275" width="280" height="65" rx="8"/>
      <rect x="440" y="275" width="280" height="65" rx="8"/>
      <rect x="80" y="380" width="640" height="50" rx="8"/>
    </g>
    <g fill="#334155" font-size="17">
      <text x="400" y="51">Research users · SSH / service access</text>
      <text x="220" y="188">Container workloads</text>
      <text x="580" y="188">KubeVirt · VM workloads</text>
      <text x="220" y="303">Compute nodes · CPU / GPU</text>
      <text x="580" y="303">Storage · PV / PVC → NAS</text>
      <text x="400" y="411">Central monitoring · node and workload status</text>
    </g>
    <g fill="#64748b" font-size="13">
      <text x="220" y="210">Namespaces · resource requests / limits</text>
      <text x="580" y="210">CDI · DataVolume / PVC · disk images</text>
      <text x="220" y="325">Scheduling by resource requirements</text>
      <text x="580" y="325">Persistent research data</text>
      <text x="400" y="489">Workload placement, storage and access are managed across servers.</text>
    </g>
    <g stroke="#94a3b8" stroke-width="1.5" fill="none">
      <path d="M400 70V95"/>
      <path d="M220 225V250H580V225M220 250V275M580 250V275"/>
      <path d="M220 340V380M580 340V380"/>
    </g>
  </g>
</svg>
