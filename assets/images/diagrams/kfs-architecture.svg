<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
  <title id="title">KFS kernel architecture</title>
  <desc id="desc">GRUB calls boot.s, which enables paging and calls kernel_main. Initialization leads to a command loop using keyboard input, VGA output and reboot.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
  <rect width="800" height="650" rx="12" fill="#fafbfc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#cbd5e1" stroke-width="1.4">
      <rect x="245" y="30" width="310" height="55" rx="8"/>
      <rect x="245" y="125" width="310" height="85" rx="8"/>
      <rect x="25" y="135" width="175" height="65" rx="8"/>
      <rect x="245" y="255" width="310" height="85" rx="8"/>
      <rect x="245" y="385" width="310" height="70" rx="8"/>
      <rect x="30" y="525" width="220" height="90" rx="8"/>
      <rect x="290" y="525" width="220" height="90" rx="8"/>
      <rect x="550" y="525" width="220" height="90" rx="8"/>
    </g>
    <g fill="#1e293b" font-size="17">
      <text x="400" y="64">GRUB · Multiboot2</text>
      <text x="400" y="153">boot.s · _start42</text>
      <text x="112" y="162">linker.ld</text>
      <text x="400" y="285">kernel_main()</text>
      <text x="400" y="414">init() · command loop</text>
      <text x="140" y="555">Keyboard</text>
      <text x="400" y="555">Terminal / VGA</text>
      <text x="660" y="555">reboot()</text>
    </g>
    <g fill="#64748b" font-size="13">
      <text x="112" y="184">Virtual / load addresses</text>
      <text x="400" y="178">Page tables → CR3 / CR0</text><text x="400" y="198">Higher-half jump → stack setup</text>
      <text x="400" y="312">terminal_initialize() · mem_init()</text>
      <text x="400" y="438">kfs$ · read and dispatch</text>
      <text x="140" y="578">getchar() · scancode mapping</text><text x="140" y="598">inb() · polling</text>
      <text x="400" y="578">Text buffer · scroll · cursor</text><text x="400" y="598">Mapped VGA memory · outb()</text>
      <text x="660" y="578">Reboot command handler</text><text x="660" y="598">Hardware reset</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M400 85V125"/><path d="M400 210V255"/><path d="M400 340V385"/>
      <path d="M325 455V488H140V525"/><path d="M400 455V525"/><path d="M475 455V488H660V525"/>
    </g>
    <path d="M200 168H245" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>
</svg>
