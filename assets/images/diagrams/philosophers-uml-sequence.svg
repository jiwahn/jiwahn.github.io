<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 590" role="img" aria-labelledby="title description">
  <title id="title">philosophers UML sequence diagram</title><desc id="description">A philosopher locks two forks, eats, updates the monitor, unlocks forks, and sleeps.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5f6368"/></marker></defs><rect width="736" height="590" fill="#fff"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle"><g fill="#fff" stroke="#5f6368"><rect x="45" y="18" width="110" height="42" rx="4"/><rect x="220" y="18" width="110" height="42" rx="4"/><rect x="405" y="18" width="110" height="42" rx="4"/><rect x="590" y="18" width="110" height="42" rx="4"/></g><g fill="#202124" font-size="13" font-weight="600"><text x="100" y="44">Philosopher</text><text x="275" y="44">Left Fork</text><text x="460" y="44">Right Fork</text><text x="645" y="44">Monitor</text></g><g stroke="#9aa0a6" stroke-dasharray="5 5"><path d="M100 60V560"/><path d="M275 60V560"/><path d="M460 60V560"/><path d="M645 60V560"/></g><g fill="none" stroke="#5f6368" stroke-width="1.35" marker-end="url(#arrow)"><path d="M100 112H275"/><path d="M100 170H460"/><path d="M100 286H645"/><path d="M100 398H460"/><path d="M100 456H275"/></g><path d="M645 340H100" fill="none" stroke="#5f6368" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g fill="#202124" font-size="12"><text x="187" y="101">pthread_mutex_lock()</text><text x="280" y="159">pthread_mutex_lock()</text><text x="372" y="275">check last_meal</text><text x="280" y="387">pthread_mutex_unlock()</text><text x="187" y="445">pthread_mutex_unlock()</text></g><g fill="#5f6368" font-size="11"><text x="100" y="235">eat</text><text x="100" y="326">update last_meal</text><text x="100" y="495">sleep</text></g><rect x="70" y="207" width="60" height="150" fill="#e8f0fe" opacity=".65"/><text x="100" y="222" fill="#1558d6" font-size="10">critical section</text><rect x="33" y="78" width="680" height="446" fill="none" stroke="#dfe1e5" rx="6"/></g>
</svg>
