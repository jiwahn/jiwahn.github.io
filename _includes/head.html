<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.home %}{{ site.title | escape }}{% else %}{{ page.title | escape }} | {{ site.title | escape }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% if page.home %}
<link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/projects.css' | relative_url }}">
<script defer src="{{ '/assets/js/analytics-preferences.js' | relative_url }}" data-analytics-id="{{ site.google_analytics | escape }}"></script>
{% if jekyll.environment == 'production' and site.google_analytics and site.google_analytics != '' and page.analytics != false %}
<script defer src="{{ '/assets/js/analytics.js' | relative_url }}" data-measurement-id="{{ site.google_analytics | escape }}" data-site-url="{{ site.url | escape }}"></script>
{% endif %}
