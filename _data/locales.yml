  description: Jiwoo Ahn's portfolio of systems software, cloud-native infrastructure, and open-source contributions.
  profile: Container runtimes · Systems software development
  introduction:
    - I value reusable, extensible code, clear project structure, and technical decisions I can explain.
    - I built my systems foundations through hands-on C/C++ projects, then expanded into container runtime development and a three-node research cloud. I am interested in software that makes system behavior and the causes of failures easier to understand.
    - I aim to apply my systems knowledge to resilient infrastructure, use AI where it can reduce repetitive work, and communicate technical decisions clearly with teammates.
